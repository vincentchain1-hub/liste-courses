name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Activer et configurer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deployer
        id: deploiement
        uses: actions/deploy-pages@v4
